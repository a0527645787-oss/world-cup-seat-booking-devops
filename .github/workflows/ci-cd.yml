name: World Cup Seat Booking CI/CD and Security

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "terraform/**"
      - ".gitignore"
      - "*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "terraform/**"
      - ".gitignore"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    name: Tests with MySQL
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      TESTING: "true"
      TEST_DATABASE_URL: mysql+pymysql://seat_booking_test:test-only-password@127.0.0.1:3306/seat_booking_test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: seat_booking_test
          MYSQL_USER: seat_booking_test
          MYSQL_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u seat_booking_test -ptest-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify MySQL test connection
        run: |
          python -c "from app import app, db; from sqlalchemy import text; app.app_context().push(); assert db.engine.dialect.name == 'mysql'; db.session.execute(text('SELECT 1')); print('MySQL test connection verified')"

      - name: Run Python tests against MySQL
        run: pytest

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2

      - name: Run Bandit Python SAST scan
        run: |
          bandit -r . \
            --severity-level high \
            -x ./tests,./terraform,./.venv,./venv,./env,./.git,**/__pycache__

      - name: Run pip-audit dependency scan
        run: pip-audit -r requirements.txt

      - name: Run Hadolint Dockerfile scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build_and_verify:
    name: Build and verify image
    runs-on: ubuntu-latest
    needs: security
    outputs:
      short_sha: ${{ steps.image_tag.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t seat-booking-app:ci .

      - name: Run application container smoke test
        run: |
          docker run --detach \
            --name seat-booking-app-ci \
            --env TESTING=true \
            --publish 127.0.0.1:5000:5000 \
            seat-booking-app:ci

          cleanup() {
            docker rm --force seat-booking-app-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/health; then
              echo "Container smoke test passed"
              exit 0
            fi

            if [ "$(docker inspect --format='{{.State.Running}}' seat-booking-app-ci)" != "true" ]; then
              echo "Application container stopped unexpectedly"
              docker logs seat-booking-app-ci
              exit 1
            fi

            echo "Waiting for application container (attempt ${attempt}/12)..."
            sleep 5
          done

          echo "Application container did not become healthy"
          docker logs seat-booking-app-ci
          exit 1

      - name: Run Trivy Docker image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: seat-booking-app:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Set Docker image tag
        id: image_tag
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Save Docker image
        run: docker save seat-booking-app:ci --output seat-booking-app-ci.tar

      - name: Upload verified Docker image
        uses: actions/upload-artifact@v4
        with:
          name: seat-booking-app-${{ steps.image_tag.outputs.short_sha }}
          path: seat-booking-app-ci.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  push_image:
    name: Push image to Docker Hub
    runs-on: ubuntu-latest
    needs: build_and_verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      short_sha: ${{ steps.image_tag.outputs.short_sha }}

    steps:
      - name: Download verified Docker image
        uses: actions/download-artifact@v4
        with:
          name: seat-booking-app-${{ needs.build_and_verify.outputs.short_sha }}

      - name: Load Docker image
        run: docker load --input seat-booking-app-ci.tar

      - name: Forward Docker image tag
        id: image_tag
        run: echo "short_sha=${{ needs.build_and_verify.outputs.short_sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        env:
          SHORT_SHA: ${{ needs.build_and_verify.outputs.short_sha }}
        run: |
          docker tag seat-booking-app:ci shlomodevops/devops-final-projectshlomo:latest
          docker tag seat-booking-app:ci shlomodevops/devops-final-projectshlomo:${SHORT_SHA}

      - name: Push Docker image
        env:
          SHORT_SHA: ${{ needs.build_and_verify.outputs.short_sha }}
        run: |
          docker push shlomodevops/devops-final-projectshlomo:latest
          docker push shlomodevops/devops-final-projectshlomo:${SHORT_SHA}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push_image
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy production stack over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            set -Eeuo pipefail

            cd ~/seat-booking-devops

            echo "Current server commit before sync:"
            git rev-parse --short HEAD

            git fetch origin main
            git reset --hard origin/main

            IMAGE_TAG="${{ needs.push_image.outputs.short_sha }}"
            echo "NEW_IMAGE_TAG=${IMAGE_TAG}"

            if [ ! -f .env ]; then
              echo "ERROR: .env file is missing on EC2. Production secrets are expected to exist on the server."
              exit 1
            fi

            if grep -q '^IMAGE_TAG=' .env; then
              PREVIOUS_IMAGE_TAG="$(grep '^IMAGE_TAG=' .env | tail -n 1 | cut -d '=' -f 2-)"
            else
              PREVIOUS_IMAGE_TAG="latest"
            fi

            echo "Previous IMAGE_TAG from .env: ${PREVIOUS_IMAGE_TAG}"
            printf "%s\n" "$PREVIOUS_IMAGE_TAG" > .previous_image_tag

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              printf "\nIMAGE_TAG=%s\n" "$IMAGE_TAG" >> .env
            fi

            echo ".env IMAGE_TAG after update:"
            grep '^IMAGE_TAG=' .env

            echo "Docker Compose resolved app image:"
            docker compose --env-file .env -f docker-compose.prod.yml config | grep 'image: shlomodevops/devops-final-projectshlomo:'

            docker compose --env-file .env -f docker-compose.prod.yml pull app
            docker compose --env-file .env -f docker-compose.prod.yml up -d

            echo "Docker Compose status after deploy:"
            docker compose --env-file .env -f docker-compose.prod.yml ps

            RUNNING_IMAGE="$(docker inspect flask_app_prod --format='{{.Config.Image}}')"
            echo "Running Docker image after deploy: ${RUNNING_IMAGE}"

            for i in $(seq 1 12); do
              if curl -fsS http://localhost/health; then
                echo "Deployment health check passed"
                echo "Running IMAGE_TAG=${IMAGE_TAG}"
                docker image prune -f
                exit 0
              fi
              echo "Health check failed, retrying attempt $i..."
              sleep 5
            done

            echo "Health check failed after deploying IMAGE_TAG=${IMAGE_TAG}"
            echo "Rolling back to previous IMAGE_TAG=${PREVIOUS_IMAGE_TAG}"

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREVIOUS_IMAGE_TAG}/" .env
            else
              printf "\nIMAGE_TAG=%s\n" "$PREVIOUS_IMAGE_TAG" >> .env
            fi

            echo ".env IMAGE_TAG after rollback update:"
            grep '^IMAGE_TAG=' .env

            docker compose --env-file .env -f docker-compose.prod.yml pull app
            docker compose --env-file .env -f docker-compose.prod.yml up -d

            echo "Docker Compose status after rollback:"
            docker compose --env-file .env -f docker-compose.prod.yml ps

            ROLLBACK_IMAGE="$(docker inspect flask_app_prod --format='{{.Config.Image}}')"
            echo "Running Docker image after rollback: ${ROLLBACK_IMAGE}"

            for i in $(seq 1 12); do
              if curl -fsS http://localhost/health; then
                echo "Rollback succeeded"
                exit 1
              fi
              echo "Rollback health check failed, retrying attempt $i..."
              sleep 5
            done

            echo "Rollback failed. Manual intervention required."
            docker compose --env-file .env -f docker-compose.prod.yml ps
            docker logs --tail=120 flask_app_prod
            docker logs --tail=80 nginx_proxy_prod
            exit 1
